<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ef">
  <title>Lingo Room</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stu">
    <!-- 1. PIN -->
    <section id="sPin" class="stu-center hidden">
      <div style="text-align:center">
        <h1>Lingo <span>Room</span></h1>
        <div class="muted">Enter the PIN on your teacher's screen</div>
      </div>
      <form class="stu-card" id="pinForm" style="display:grid;gap:12px">
        <input id="pinInput" class="field pin" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="PIN" required>
        <button class="btn primary wide">Next</button>
        <div class="err" id="pinErr"></div>
      </form>
      <div class="note"><a href="host.html" id="hostLink">I'm the teacher →</a></div>
    </section>

    <!-- 2. Name -->
    <section id="sName" class="stu-center hidden">
      <div style="text-align:center">
        <h1>What's your name?</h1>
        <div class="muted">Room <b id="nameRoom"></b></div>
      </div>
      <form class="stu-card" id="nameForm" style="display:grid;gap:12px">
        <input id="nameInput" class="field hanzi" autocomplete="off" maxlength="20" placeholder="Your name / 名字" required>
        <button class="btn primary wide">Join 加入</button>
        <div class="err" id="nameErr"></div>
      </form>
    </section>

    <!-- 3. Play -->
    <section id="sPlay" class="hidden" style="display:flex;flex-direction:column;flex:1;gap:12px">
      <div class="stu-head">
        <div><b id="meName"></b> <span class="muted">· <span id="meRoom"></span></span></div>
        <span class="score-pill" id="scorePill">⭐ <span id="meScore">0</span></span>
      </div>

      <div class="stu-prompt hidden" id="pBox">
        <div class="lbl">Say this · 请说</div>
        <div class="word hanzi" id="pWord"></div>
        <div class="py" id="pPy"></div>
      </div>
      <div class="stu-hint" id="hintBox">Answer below 👇</div>

      <div class="tabs hidden" id="modeTabs">
        <button data-mode="speak">🎤 Speak</button>
        <button data-mode="type">⌨️ Type</button>
        <button data-mode="write">✍️ Write</button>
      </div>

      <!-- Speak -->
      <div class="pane" id="paneSpeak">
        <div class="heard">
          <div class="text hanzi" id="heardText"></div>
          <div class="py" id="heardPy"></div>
        </div>
        <div class="mic-wrap">
          <button class="mic" id="mic" aria-label="Tap to speak">🎤</button>
          <div class="note" id="micNote">Tap to speak</div>
        </div>
      </div>

      <!-- Type -->
      <form class="pane type-row hidden" id="paneType">
        <input id="typeInput" class="hanzi" maxlength="200" autocomplete="off" placeholder="输入中文…">
        <button class="btn primary">Send</button>
      </form>

      <!-- Write (handwriting board) -->
      <div class="pane hidden" id="paneWrite">
        <div class="w-answer">
          <div class="w-text hanzi" id="wText"><span class="muted">Write a character below ✍️</span></div>
          <button class="btn" id="wBack" title="Delete last character">⌫</button>
          <button class="btn primary" id="wSend">Send</button>
        </div>
        <div class="w-cands hanzi" id="wCands"></div>
        <div class="w-board">
          <canvas id="wCanvas"></canvas>
          <button class="w-tool left" id="wUndo" title="Undo last stroke">↶</button>
          <button class="w-tool right" id="wClear" title="Clear">✕</button>
        </div>
      </div>

      <div class="feedback" id="feedback"></div>

      <div class="mine-wrap">
        <h3><span>My words</span><span id="mineCount"></span></h3>
        <ul class="mine hanzi" id="mine"><li class="none">Your words will appear here</li></ul>
      </div>
    </section>

    <!-- 4. Ended / removed -->
    <section id="sEnd" class="stu-center hidden" style="text-align:center">
      <h1 id="endTitle">Class ended 再见！</h1>
      <p class="muted" id="endMsg">Thanks for joining.</p>
      <button class="btn primary wide" id="endBtn">Join another room</button>
    </section>
  </div>

  <!-- Celebration when the teacher marks a word correct -->
  <div class="yay hidden" id="yay">
    <div class="big">🎉</div>
    <h2>太棒了！Great job!</h2>
    <div class="word hanzi" id="yayWord"></div>
    <div class="pts">+1000</div>
    <div class="tap">Tap to continue</div>
  </div>
  <div class="toast hidden" id="toast"></div>

  <script type="module" src="student.js"></script>
</body>
</html>
